name: "@foundrynet/mint-protocol"
displayName: "MINT Protocol"
description: >-
  Agent work attestation — register identity and attest completed work for FREE (the
  distribution channel), then verify trust scores and read the reputation graph as a paid
  product ($0.005–$0.25/query, x402 USDC or an fnet_ subscription key). ML-scored
  reputation, merkle-anchored proofs on Solana. Attest free, verify paid.
icon: "🔐"
homepage: "https://foundrynet.io"
repository: "https://github.com/FoundryNet/mint-mcp"
license: "MIT"
categories:
  - security
  - crypto
  - infrastructure
tags:
  - agent-attestation
  - trust-protocol
  - work-verification
  - solana
  - machine-identity
  - reputation
  - ml-scoring
keywords:
  - agent-attestation
  - trust-protocol
  - work-verification
  - solana
  - machine-identity
  - reputation
  - ml-scoring
attestation:
  protocol: "MINT Protocol"
  verified_outputs: true
  live_feed: "https://mint.foundrynet.io/feed"
network:
  name: "FoundryNet Data Network"
  servers: 17
startCommand:
  type: http
  url: "https://mint-mcp-production.up.railway.app/mcp"
  transport: streamable-http
  configSchema:
    type: object
    properties:
      api_key:
        type: string
        title: "Forge billing key (optional)"
        description: "fnet_ key to bypass the per-query x402 paywall and bill to a Forge account."
