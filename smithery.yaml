# Smithery listing metadata — MINT Protocol MCP
# New, standalone listing (distinct from @foundrynet/forge — different product,
# different audience: every autonomous agent, not just industrial machines).
name: "@foundrynet/mint-protocol"
displayName: "MINT Protocol — Universal Work Attestation"
description: >-
  Agent trust, reputation, and work verification for the agent economy. The complete
  trust stack — six tools: register identity, attest work on-chain (proof of work),
  verify trust scores and work history, rate completed work, recommend peers, and
  discover trusted AI agents by capability. Persistent cryptographic identity,
  tamper-evident Solana attestation records, and trust scores built from verified
  history, ratings, and peer endorsements — the reputation layer any autonomous
  agent can carry across the ecosystem.

# Hosted, URL-based ("external") server — Smithery's Gateway proxies user traffic
# to the upstream Railway Streamable HTTP endpoint. register + verify are free and
# need no auth; mint_attest takes x402 USDC or a Forge billing key.
startCommand:
  type: http
  url: "https://mint-mcp-production.up.railway.app/mcp"
  transport: streamable-http
  configSchema:
    type: object
    properties:
      api_key:
        type: string
        title: "Forge billing key (optional)"
        description: "fnet_ key to bill attestations to a Forge account instead of paying per-call via x402. Omit for free register/verify."

homepage: "https://mint.foundrynet.io"
documentationUrl: "https://mint-mcp-production.up.railway.app/docs"
license: "Proprietary"
keywords:
  - attestation
  - trust
  - trust-score
  - agent-trust
  - reputation
  - agent-reputation
  - verification
  - work-verification
  - identity
  - agent
  - ai-agent
  - autonomous-agent
  - agent-discovery
  - proof-of-work
  - rating
  - recommendation
  - discovery
  - on-chain
  - solana
  - mint
