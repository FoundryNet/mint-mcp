name: "@foundrynet/mint-protocol"
displayName: "MINT Protocol"
description: >-
  Agent work attestation — register machine identity, attest completed work, verify trust scores, ML-scored reputation, and merkle-anchored proofs on Solana.
icon: "🔐"
homepage: "https://foundrynet.io"
repository: "https://github.com/FoundryNet/mint-mcp"
license: "MIT"
categories:
  - security
  - crypto
  - infrastructure
tags:
  - agent-attestation
  - trust-protocol
  - work-verification
  - solana
  - machine-identity
  - reputation
  - ml-scoring
keywords:
  - agent-attestation
  - trust-protocol
  - work-verification
  - solana
  - machine-identity
  - reputation
  - ml-scoring
attestation:
  protocol: "MINT Protocol"
  verified_outputs: true
  live_feed: "https://mint.foundrynet.io/feed"
network:
  name: "FoundryNet Data Network"
  servers: 17
startCommand:
  type: http
  url: "https://mint-mcp-production.up.railway.app/mcp"
  transport: streamable-http
  configSchema:
    type: object
    properties:
      api_key:
        type: string
        title: "Forge billing key (optional)"
        description: "fnet_ key to bypass the per-query x402 paywall and bill to a Forge account."
